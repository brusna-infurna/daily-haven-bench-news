<style>
  :root{--bg:#EDE9E0;--card:#FBF9F5;--ink:#1C1A17;--soft:#45423C;--mute:#6B675F;--rule:rgba(28,26,23,.12);--green:#2F4634;--green-ink:#3E5A42;
    --p-wellness-residence:#3E5A42;--p-membership:#8A6A3F;--p-longevidade:#4A5A7A;--p-lifestyle:#7A4A5A;--p-comunidade:#5A6A4A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .serif{font-family:'Marcellus',serif;font-weight:400}
  a{color:inherit;text-decoration:none}
  a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--green-ink);outline-offset:3px}
  .page{max-width:1240px;margin:0 auto;padding:24px 16px 64px}
  @media(min-width:760px){.page{padding:32px 40px 80px}}

  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .top h1{font-size:30px;line-height:1}
  @media(min-width:760px){.top h1{font-size:36px}}
  .top .sub{font-size:13.5px;color:var(--mute);margin-top:8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .top select{font-family:'Marcellus',serif;font-size:15px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);padding:1px 0;cursor:pointer;-webkit-appearance:none;appearance:none}

  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chips .lbl{font-size:12.5px;color:var(--mute);margin-right:2px}
  .chip{font:inherit;font-size:13px;padding:8px 14px;border:1px solid rgba(28,26,23,.3);background:transparent;color:var(--soft);border-radius:999px;cursor:pointer;min-height:36px}
  .chip:hover{border-color:var(--ink)}
  .chip.on{background:var(--ink);color:#F5F1EA;border-color:var(--ink)}
  .chip.p-wellness-residence.on{background:var(--p-wellness-residence);border-color:var(--p-wellness-residence)}
  .chip.p-membership.on{background:var(--p-membership);border-color:var(--p-membership)}
  .chip.p-longevidade.on{background:var(--p-longevidade);border-color:var(--p-longevidade)}
  .chip.p-lifestyle.on{background:var(--p-lifestyle);border-color:var(--p-lifestyle)}
  .chip.p-comunidade.on{background:var(--p-comunidade);border-color:var(--p-comunidade)}
  .filterbar{display:flex;flex-direction:column;gap:10px;padding:14px 0 18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:18px}
  @media(min-width:900px){.filterbar{flex-direction:row;gap:26px;align-items:center;flex-wrap:wrap}}
  .filterbar .n{font-size:12.5px;color:var(--mute);margin-left:auto}

  .grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  @media(min-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:1040px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}

  .lead{background:var(--green);color:#F5F1EA;padding:28px 30px;border-radius:4px;display:flex;flex-direction:column;gap:14px}
  @media(min-width:700px){.lead{grid-column:span 2}}
  .lead h2{font-size:28px;line-height:1.12}
  @media(min-width:760px){.lead h2{font-size:36px}}
  .lead p{font-size:15px;line-height:1.65;opacity:.92;max-width:70ch}
  .watch{background:var(--card);padding:22px 24px;border-radius:4px;border-top:4px solid var(--green);display:flex;flex-direction:column;gap:10px}
  .watch h2{font-size:19px}
  .watch div{font-size:13.5px;line-height:1.55;color:var(--soft);padding-top:10px;border-top:1px solid var(--rule)}

  .card{background:var(--card);padding:22px 24px 18px;border-radius:4px;border-top:4px solid var(--green-ink);display:flex;flex-direction:column;gap:10px}
  .card.p-wellness-residence{border-top-color:var(--p-wellness-residence)}
  .card.p-membership{border-top-color:var(--p-membership)}
  .card.p-longevidade{border-top-color:var(--p-longevidade)}
  .card.p-lifestyle{border-top-color:var(--p-lifestyle)}
  .card.p-comunidade{border-top-color:var(--p-comunidade)}
  .card .kick{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .card .kick span{font-weight:400;color:var(--mute)}
  .card.p-wellness-residence .kick{color:var(--p-wellness-residence)}
  .card.p-membership .kick{color:var(--p-membership)}
  .card.p-longevidade .kick{color:var(--p-longevidade)}
  .card.p-lifestyle .kick{color:var(--p-lifestyle)}
  .card.p-comunidade .kick{color:var(--p-comunidade)}
  .card h3{font-size:21px;line-height:1.25}
  .card h3 a:hover{text-decoration:underline;text-underline-offset:4px}
  .card .txt{font-size:13.5px;line-height:1.6;color:var(--soft)}
  .card .use{font-size:13.5px;line-height:1.6;color:var(--ink);padding:10px 12px;background:rgba(62,90,66,.07)}
  .card .use i{font-family:'Marcellus',serif;font-style:normal;color:var(--green-ink)}
  .card .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute);padding-top:8px;border-top:1px solid var(--rule)}
  .card .foot a{text-decoration:underline;text-underline-offset:3px}
  .card.hl{box-shadow:0 0 0 1px var(--green-ink)}
  .empty{grid-column:1/-1;padding:40px 0;color:var(--mute);font-size:14px}
  footer{margin-top:48px;font-size:12.5px;color:var(--mute);line-height:1.7;max-width:72ch}
</style>
</head>

<script>
const RADAR = {"projeto": "Daily Haven Bench News", "atualizado": "2026-10-13", "dias": [{"data": "2026-10-13", "manchete": "Porto Feliz virou endereço de mercado. E o clube, lá fora, virou clínica.", "editorial": "A JHSF lançou o Boa Vista Estates com VGV de R$ 3 bilhões e diz ter vendido mais da metade em dois dias, e um torneio internacional de tênis chega ao mesmo município com patrocínio da Hugo Boss. Lá fora, Canyon Ranch abre no Texas com 134 casas à venda dentro do resort, a Minor Hotels cria uma marca de longevidade com membership que carrega o prontuário entre unidades, e a Soho House planeja uma casa em Nova York ancorada num health club de dois andares. A leitura por baixo: longevidade e recuperação estão virando a âncora física dos clubes, e o que sustenta a venda da casa é o programa, não a amenidade.", "atencao": ["Boa Vista Estates define a régua de evento, amenidade e preço por m² em Porto Feliz. Vendas precisa de um discurso de escala pronto: 75 casas e um comitê contra 250 famílias e golfe.", "Beyond The Club publicou estrutura de título, teto de sócios e regra de dependentes. É a referência brasileira mais próxima pra fechar o desenho do membership do Haven.", "Minor Hotels e Soho House colocaram saúde contínua e recuperação no centro do clube. Vale decidir se o Haven entra nesse eixo com parceiro clínico ou fica na programação."], "itens": [{"title": "JHSF lança Boa Vista Estates em Porto Feliz com 250 famílias e VGV de R$ 3 bilhões", "source": "Exame", "url": "https://exame.com/casual/com-show-de-shania-twain-jhsf-lanca-boa-vista-estates-em-porto-feliz/", "date": "2026-09-22", "region": "Porto Feliz/SP", "escopo": "brasil", "pilar": "wellness-residence", "resumo": "A JHSF apresentou em 26 de setembro o Boa Vista Estates, nova fase do Complexo Boa Vista, com 7 milhões de m² para 250 famílias, campo de golfe de 18 buracos assinado por Greg Norman, spa, kids club, centro médico e heliponto. Arquitetura social de Sig Bergamin e Murilo Lomas, paisagismo de Maria João d'Orey. VGV potencial de R$ 3 bilhões e show privado de Shania Twain no lançamento.", "por_que_importa": "É o concorrente mais visível do Haven no mesmo município e define a régua de amenidade e de evento de lançamento na região. Vendas pode usar o contraste de escala (250 famílias em 7 milhões de m² contra 75 casas) como argumento de comunidade e proximidade.", "para": ["vendas", "marketing"], "verificado": true, "destaque": true}, {"title": "Mais da metade do Boa Vista Estates já foi vendida, diz CEO da JHSF", "source": "Forbes Brasil", "url": "https://forbes.com.br/forbes-money/forbes-real-estate/2026/09/boa-vista-estates-jhsf-vendas/", "date": "2026-09-28", "region": "Porto Feliz/SP", "escopo": "brasil", "pilar": "wellness-residence", "resumo": "Dois dias após o lançamento, Augusto Martins, CEO da JHSF, afirmou que mais de 50% do empreendimento já havia sido vendido. A Forbes reporta ticket médio de cerca de R$ 2,6 mil por m² nos lotes e R$ 1,2 mil por m² nas estâncias, com mais de 18 meses para entrega completa das amenidades.", "por_que_importa": "Mostra demanda ativa por segunda residência de altíssimo padrão em Porto Feliz e dá referência de preço por m². Parte desse público já está comprando na região e pode ser abordada para o clube.", "para": ["vendas", "parcerias"], "verificado": true, "destaque": true}, {"title": "Beyond The Club abre títulos familiares a partir de R$ 900 mil, limitados a 3.000", "source": "Seu Dinheiro", "url": "https://www.seudinheiro.com/2026/lifestyle/beyond-the-club-como-e-e-quanto-custa-ser-socio-do-clube-de-surf-e-lifestyle-em-sao-paulo-lefp/", "date": "2026-10-02", "region": "São Paulo/SP", "escopo": "brasil", "pilar": "membership", "resumo": "O Beyond The Club, na Marginal Pinheiros, opera em plena capacidade desde 1º de junho, com piscina de ondas, mais de 50 modalidades, spas e ambulatório sob responsabilidade do Hospital Sírio-Libanês. Títulos patrimoniais familiares partem de R$ 900 mil, mais mensalidade, com teto de 3.000 títulos. Cada título cobre titular, cônjuge, filhos e ascendentes acima de 70 anos; o público principal são famílias e casais em torno de 45 anos.", "por_que_importa": "Referência concreta de estrutura de título, regra de dependentes e teto de sócios pra desenhar a oferta de membership do Haven. A parceria com hospital de referência dentro do clube é precedente pro eixo de longevidade.", "para": ["clube", "vendas"], "verificado": true, "destaque": true}, {"title": "Canyon Ranch Austin abre no fim de outubro com 134 casas à venda dentro do resort", "source": "Community Impact", "url": "https://communityimpact.com/lake-travis-westlake/business/canyon-ranch-wellness-resort-to-open-for-guests-in-late-october/", "date": "2026-10-13", "region": "Spicewood, Texas (EUA)", "escopo": "mundo", "pilar": "wellness-residence", "resumo": "O Canyon Ranch abre em Spicewood, em 600 acres, com 141 quartos e 134 unidades residenciais. As casas têm entre 3.208 e 4.827 pés quadrados e partem de US$ 3,8 milhões, com acesso do proprietário às instalações e aos programas do resort. O CEO calcula de cinco a sete anos para concluir as casas. A data de abertura varia entre fontes (15 ou 22 de outubro).", "por_que_importa": "É o caso mais próximo do modelo do Haven: casas vendidas junto de um clube de bem-estar com programa próprio. Serve de argumento de venda (acesso a programa de saúde para o morador) e de referência de ritmo de ocupação em fases.", "para": ["vendas", "parcerias", "marketing"], "verificado": true, "destaque": true}, {"title": "Minor Hotels lança a marca Life Longevity com membership que leva o prontuário de um local a outro", "source": "European Spa Magazine", "url": "https://europeanspamagazine.com/minor-hotels-launches-new-life-longevity-brand/", "date": "2026-10-12", "region": "Tailândia / global", "escopo": "mundo", "pilar": "longevidade", "resumo": "A Minor Hotels apresentou a Life Longevity, marca que une formatos de resort, urbano e, no futuro, residencial. Diagnósticos, consultas e registros acompanham a pessoa entre as unidades. Lança junto o Circle of Life, adesão opcional com check-ins regulares e acesso a unidades em vários países. Unidades atuais: Layan Life (Phuket) e Bangkok Life (St. Regis Bangkok).", "por_que_importa": "Uma grande operadora ligando longevidade, membership e residência sob um mesmo histórico de saúde. Dá ideia de pacote pro Haven: acompanhamento contínuo do membro com parceiros de diagnóstico, em vez de programas avulsos.", "para": ["parcerias", "clube", "marketing"], "verificado": true, "destaque": true}, {"title": "Soho House planeja quarta casa em Nova York ancorada num health club de dois andares", "source": "Hoodline", "url": "https://hoodline.com/2026/10/soho-house-plans-fourth-nyc-club-in-nomad-s-johnston-building-by-2028", "date": "2026-10-13", "region": "Nova York (EUA)", "escopo": "mundo", "pilar": "membership", "resumo": "A Soho House prevê abrir em 2028 uma casa no Johnston Building, no NoMad, com um Soho Health Club de dois andares, saunas, banhos de gelo e hammam. O prédio também abriga o hotel The Ned, com entrada e espaços de membros separados. A matéria cita anuidade de US$ 6.000 em Nova York.", "por_que_importa": "O maior clube do mundo está colocando recuperação e saúde como âncora física da nova casa. Argumento pro Haven priorizar o espaço de recuperação (sauna, banho frio, hammam) na comunicação do clube e na programação semanal.", "para": ["clube", "marketing"], "verificado": true, "destaque": true}, {"title": "Vik e Grupo Luan avançam com complexo de R$ 600 milhões em Araçoiaba da Serra", "source": "Bloomberg Línea Brasil", "url": "https://www.bloomberglinea.com.br/estilo-de-vida/com-colheita-simbolica-vik-e-grupo-luan-promovem-hotel-em-projeto-de-r-600-mi-em-sp/", "date": "2026-09-25", "region": "Araçoiaba da Serra/SP", "escopo": "brasil", "pilar": "lifestyle", "resumo": "A vinícola chilena Vik realizou a segunda Vendimia na Fazenda Vista Verde, com ingressos de R$ 2 mil esgotados. O complexo soma cerca de R$ 600 milhões: hotel de 50 quartos (R$ 200 milhões), 160 lotes de no mínimo 2.000 m² a R$ 3 a 3,5 milhões (95% vendidos) e doze casas de 480 a 553 m². Entrega prevista para o fim de 2028.", "por_que_importa": "Um evento de repertório (colheita, vinho, curadoria de arte) vende lote e hotel ao mesmo tempo, a 40 minutos de Porto Feliz. Referência pra programação de eventos pagos e possível parceria com produtores e curadores.", "para": ["marketing", "parcerias", "clube"], "verificado": true, "destaque": false}, {"title": "Australian Open Junior Series chega ao Boa Vista Village com Hugo Boss como patrocinadora", "source": "Máquina do Esporte", "url": "https://maquinadoesporte.com.br/tenis/hugo-boss-patrocina-etapa-sul-americana-do-australian-open-junior-series-no-brasil/", "date": "2026-10-08", "region": "Porto Feliz/SP", "escopo": "brasil", "pilar": "comunidade", "resumo": "A Hugo Boss patrocina a etapa sul-americana do Australian Open Junior Series, de 14 a 18 de outubro, no Boa Vista Village. A marca terá loja temporária no evento e será fornecedora oficial de vestuário a partir de 2027. Quadras no padrão GreenSet de Melbourne, e os campeões ganham wild cards pro juvenil do Australian Open de 2027.", "por_que_importa": "Torneio internacional no mesmo município transforma Porto Feliz em destino de agenda esportiva e de marcas. Clube pode estudar o formato (torneio, loja temporária, patrocinador) e parcerias pode mapear quem já está ativando na região.", "para": ["clube", "parcerias", "marketing"], "verificado": true, "destaque": false}, {"title": "Six Senses anuncia cinco aberturas em 2027, duas delas com residências", "source": "TravelMole", "url": "https://travelmole.com/news/six-senses-expands-five-2027-openings", "date": "2026-10-08", "region": "Itália, Espanha, Israel, França, Arábia Saudita", "escopo": "mundo", "pilar": "wellness-residence", "resumo": "A Six Senses confirmou cinco aberturas para 2027: Milão, Quexigal Palace (perto de Madri), Tel Aviv, Vale do Loire e Wadi Safar. Tel Aviv terá 140 quartos e 55 residências. O Vale do Loire terá 88 suítes e vilas, 70 vilas privadas e campo de golfe.", "por_que_importa": "Mostra a proporção entre hospedagem e residências que uma operadora de bem-estar usa, inclusive em propriedade histórica. Comparativo útil pra vendas e parcerias na conversa sobre Ownspitality.", "para": ["parcerias", "vendas"], "verificado": true, "destaque": false}, {"title": "Equinox abre seu primeiro hotel fora dos EUA, no AMAALA, com 21 residências de marca", "source": "Hospitality & Catering News", "url": "https://www.hospitalityandcateringnews.com/2026/09/equinox-resort-amaala-opens-as-brands-first-hotel-outside-the-us/", "date": "2026-09-04", "region": "AMAALA, Mar Vermelho (Arábia Saudita)", "escopo": "mundo", "pilar": "wellness-residence", "resumo": "O Equinox Resort AMAALA tem 128 quartos e suítes e 21 residências de marca, com projeto da Foster + Partners e interiores da Rockwell Group. Spa de 1.602 m² com crioterapia, sauna infravermelha e oxigenoterapia hiperbárica. Os quartos usam plataforma de ciência do sono com iluminação circadiana.", "por_que_importa": "Uma marca nascida de academia vira operadora de residência, com sono e recuperação como produto central. Referência pra definir quais serviços de desempenho e sono entram na proposta de valor da casa do Haven.", "para": ["marketing", "parcerias", "clube"], "verificado": true, "destaque": false}, {"title": "Hospitais sem fins lucrativos nos EUA lançam clínicas de longevidade a partir de US$ 5.500 por ano", "source": "STAT News", "url": "https://www.statnews.com/2026/10/06/hospitals-longevity-clinics-healthy-aging-wellness-trend/", "date": "2026-10-06", "region": "EUA", "escopo": "mundo", "pilar": "longevidade", "resumo": "Northwestern Medicine, Weill Cornell e Mayo Clinic têm programas de longevidade pagos pelo próprio paciente, de US$ 5.500 por ano a planos de US$ 45.000 anuais. Os exames cobrem coração, cérebro, pulmões, força e capacidade cardiorrespiratória. Críticos questionam a cobrança em instituições sem fins lucrativos e a falta de evidência para alguns testes. Matéria para assinantes; verificação feita na parte aberta.", "por_que_importa": "Instituições médicas de peso entrando no tema facilita parceria com hospitais e laboratórios. A crítica sobre evidência indica que a comunicação do Haven deve citar parceiros clínicos e evitar promessa de resultado.", "para": ["parcerias", "marketing"], "verificado": true, "destaque": false}, {"title": "Housi e CF lançam BelleMont, wellness real estate em Campos do Jordão com VGV de R$ 65 milhões", "source": "Money Report", "url": "https://www.moneyreport.com.br/negocios/wellness-real-estate-chega-a-campos-do-jordao-em-projeto-de-r-65-mi/", "date": "2026-09-02", "region": "Campos do Jordão/SP", "escopo": "brasil", "pilar": "wellness-residence", "resumo": "A Housi e a CF Empreendimentos apresentaram em 4 de setembro o BelleMont, com 84 unidades (studios e duplex de 40 a 62 m²), preço médio projetado de cerca de R$ 14 mil por m² e entrega prevista para o fim de 2029. Piscina coberta aquecida, spa, sauna e academia. A estratégia mira investidor que combina segunda residência com locação por temporada.", "por_que_importa": "O termo wellness real estate já aparece em produto de ticket menor na Mantiqueira. Vendas diferencia o Haven por curadoria de comunidade e repertório, não só por amenidade; o preço por m² é ponto de comparação.", "para": ["vendas", "marketing"], "verificado": true, "destaque": false}, {"title": "Novotel transforma longevidade em modelo operacional para cerca de 630 hotéis", "source": "Skift (conteúdo patrocinado)", "url": "https://skift.com/2026/09/08/novotel-longevity-travel-everyday-wellness/", "date": "2026-09-08", "region": "Global (Accor)", "escopo": "mundo", "pilar": "lifestyle", "resumo": "O programa Longevity Everyday organiza a operação em quatro pilares: sono, alimentação, movimento const PILAR = {"wellness-residence":"Wellness residence","membership":"Membership","longevidade":"Longevidade","lifestyle":"Lifestyle","comunidade":"Comunidade"};
const M=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${+dd} de ${M[+m-1]} de ${y}`; };
const fmtShort = d => { const [y,m,dd]=d.split("-"); return `${+dd} ${M[+m-1]}`; };
const state = {day: RADAR.dias[0].data, escopo:"", pilar:"", para:""};

const sel = document.getElementById("day");
RADAR.dias.forEach(d => { const o=document.createElement("option"); o.value=d.data; o.textContent=fmt(d.data); sel.appendChild(o); });
sel.addEventListener("change", e => { state.day=e.target.value; render(); });
document.querySelectorAll(".chips[data-f]").forEach(g => g.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); b.classList.add("on"); state[g.dataset.f]=b.dataset.v; render();
})));

function render(){
  const day = RADAR.dias.find(d=>d.data===state.day) || RADAR.dias[0];
  const items = day.itens || [];
  const br=items.filter(i=>i.escopo==="brasil").length;
  document.getElementById("tally").textContent = `${items.length} itens conferidos, ${br} do Brasil e ${items.length-br} do mundo`;
  const list = items.filter(i => (!state.escopo||i.escopo===state.escopo) && (!state.pilar||i.pilar===state.pilar) && (!state.para||(i.para||[]).includes(state.para)))
    .sort((a,b)=> (b.destaque?1:0)-(a.destaque?1:0) || b.date.localeCompare(a.date));
  document.getElementById("count").textContent = `${list.length} de ${items.length}`;
  const unfiltered = !state.escopo && !state.pilar && !state.para;
  const head = unfiltered ? `
    <section class="lead"><h2 class="serif">${esc(day.manchete||"")}</h2><p>${esc(day.editorial||"")}</p></section>
    <aside class="watch"><h2 class="serif">Pra prestar atenção</h2>${(day.atencao||[]).map(a=>`<div>${esc(a)}</div>`).join("")}</aside>` : "";
  const cards = list.map(i => `
    <article class="card p-${esc(i.pilar)} ${i.destaque?'hl':''}">
      <div class="kick">${esc(PILAR[i.pilar]||i.pilar)}<span>${i.escopo==="brasil"?"Brasil":"Mundo"}, ${esc(i.region||"")}</span></div>
      <h3 class="serif"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></h3>
      <p class="txt">${esc(i.resumo)}</p>
      <div class="use"><i>O que o Haven faz com isso. </i>${esc(i.por_que_importa)}</div>
      <div class="foot"><span><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.source)}</a>, ${fmtShort(i.date)}</span><span>${(i.para||[]).map(esc).join(", ")}</span></div>
    </article>`).join("");
  document.getElementById("grid").innerHTML = head + (cards || '<div class="empty">Nenhum item com esses filtros. Escolha outro pilar ou veja tudo.</div>');
}
render();
</script>
